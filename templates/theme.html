{# Runs in <head>, before the first paint: setting data-theme afterwards would
   flash the system theme first on every page load. #}
<script>
  (function () {
    try {
      var t = localStorage.getItem('theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {}  // private mode, or storage disabled — fall back to the system theme
  })();
</script>
