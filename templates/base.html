<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}S3 Mail{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  {% include "theme.html" %}
</head>
<body>
  <div id="nav-progress" aria-hidden="true"></div>

  <header class="topbar">
    <a class="brand" href="{{ url_for('inbox', **nav(mb)) }}">S3 Mail</a>

    <form class="filters" action="{{ request.path }}" method="get">
      <select name="mb" data-autosubmit title="Mailbox">
        {% for box in mailboxes %}
        <option value="{{ box.id }}" {{ 'selected' if box.id == mb.id }}>{{ box.label }}</option>
        {% endfor %}
      </select>

      <select name="to" data-autosubmit title="Recipient address">
        <option value="">All addresses</option>
        {% for addr, count in addresses %}
        <option value="{{ addr }}" {{ 'selected' if addr == address }}>{{ addr }} ({{ count }})</option>
        {% endfor %}
      </select>

      <input type="search" name="q" placeholder="Search sender or subject"
             value="{{ query|default('', true) }}" autocomplete="off">
    </form>

    <nav>
      <a href="{{ url_for('inbox', **nav(mb, to=address)) }}">Inbox</a>
      <a href="{{ url_for('inventory', **nav(mb, to=address)) }}">Inventory</a>
      {# New message and Refresh live in the list header, next to the mail they act on. #}
      <button type="button" id="theme-toggle" class="theme-toggle">Auto</button>
    </nav>
  </header>

  {% block content %}{% endblock %}

  <script>
    // Every link here costs a round trip to S3 — listing a bucket, ranged GETs
    // for headers, a full object for a body. Announce the navigation as soon as
    // it starts instead of leaving the page looking inert.
    var navProgress = (function () {
      var bar = document.getElementById('nav-progress');
      var timer;

      // Under ~150ms the bar is just a flash; past it, the silence is the bug.
      function start() { clearTimeout(timer); timer = setTimeout(function () { bar.classList.add('on'); }, 150); }
      function stop() { clearTimeout(timer); bar.classList.remove('on'); }

      function plainClick(ev) {
        return !ev.defaultPrevented && ev.button === 0 &&
               !ev.metaKey && !ev.ctrlKey && !ev.shiftKey && !ev.altKey;
      }

      document.addEventListener('click', function (ev) {
        if (!plainClick(ev)) return;
        var a = ev.target.closest('a[href]');
        // New tabs and attachment downloads leave this page where it is, so a
        // bar that only stops on unload would spin forever.
        if (!a || a.target || a.hasAttribute('download') || a.hasAttribute('data-download')) return;
        var href = a.getAttribute('href');
        if (!href || href.charAt(0) === '#') return;
        start();
      });

      document.addEventListener('submit', function (ev) {
        if (!ev.defaultPrevented) start();
      });

      // Back/forward restores the page from the bfcache mid-animation otherwise.
      window.addEventListener('pageshow', stop);

      return { start: start, stop: stop, plainClick: plainClick };
    })();

    // Switching mailbox invalidates the address filter, since the addresses
    // belong to the mailbox you are leaving.
    document.querySelectorAll('[data-autosubmit]').forEach(function (el) {
      el.addEventListener('change', function () {
        if (el.name === 'mb') {
          el.form.querySelector('[name=to]').value = '';
        }
        // form.submit() fires no submit event, so the bar needs telling.
        navProgress.start();
        el.form.submit();
      });
    });

    // Theme cycles auto → light → dark, so the system setting stays reachable
    // rather than being a one-way door out of it.
    (function () {
      var btn = document.getElementById('theme-toggle');
      if (!btn) return;
      var order = ['auto', 'light', 'dark'];
      var labels = { auto: 'Auto', light: 'Light', dark: 'Dark' };

      function stored() {
        try {
          var t = localStorage.getItem('theme');
          if (t === 'light' || t === 'dark') return t;
        } catch (e) {}
        return 'auto';
      }

      function apply(mode) {
        if (mode === 'auto') {
          delete document.documentElement.dataset.theme;
        } else {
          document.documentElement.dataset.theme = mode;
        }
        btn.textContent = labels[mode];
        btn.title = mode === 'auto'
          ? 'Theme: following the system — click for light'
          : 'Theme: ' + mode + ' — click for ' +
            order[(order.indexOf(mode) + 1) % order.length];
        try {
          mode === 'auto' ? localStorage.removeItem('theme')
                          : localStorage.setItem('theme', mode);
        } catch (e) {}
      }

      apply(stored());
      btn.addEventListener('click', function () {
        apply(order[(order.indexOf(stored()) + 1) % order.length]);
      });
    })();
  </script>
</body>
</html>
