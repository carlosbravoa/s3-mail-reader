<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font: 14px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif;
           color: #1a1a1a; background: #fff; margin: 16px; word-break: break-word; }
    img { max-width: 100%; height: auto; }
    table { max-width: 100%; }
    pre { white-space: pre-wrap; font: 13px/1.5 ui-monospace, monospace; }
    img[data-blocked-src] {
      display: inline-block; min-width: 24px; min-height: 24px;
      border: 1px dashed #bbb; background: #f4f4f4;
    }
  </style>
</head>
<body>{{ body|safe }}</body>
</html>
